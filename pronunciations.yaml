# How the narrator should say tricky words. Left: the word as written in the script.
# Right: how to say it, spelt out. Captions and the script still show the left-hand spelling.
# Rules: whole words only, upper/lower case must match, put plurals in separately.
# Use hyphens between syllables, e.g. "eye-sa". Add a line, commit, and the next render uses it.

